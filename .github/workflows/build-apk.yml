name: Build APK

# Builda o APK automaticamente a cada push, e também sob demanda (botão "Run workflow").
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable

      - name: Criar estrutura do projeto Flutter (android)
        run: flutter create --project-name diagnostico_rede --org com.diagnostico --platforms android .

      - name: Colocar o nosso código
        run: cp app_src/main.dart lib/main.dart

      - name: Adicionar os plugins (versões estáveis fixadas)
        run: flutter pub add wifi_scan:^0.4.1 network_info_plus:^5.0.3 permission_handler:^11.3.1 http:^1.2.0 share_plus:^7.2.2 printing:^5.12.0 pdf:^3.10.8 qr_flutter:^4.1.0 url_launcher:^6.2.6 image_picker:^1.0.7 shared_preferences:^2.2.2

      - name: Injetar permissões no AndroidManifest
        run: |
          python3 - <<'PY'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation"/>
          """
          if "ACCESS_FINE_LOCATION" not in s:
              s = re.sub(r"(<manifest[^>]*>)", r"\1" + perms, s, count=1)
              open(p, "w", encoding="utf-8").write(s)
          print("Manifest atualizado.")
          PY

      - name: Build do APK (release)
        run: flutter build apk --release

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-rede-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publicar APK em Release (link direto pra baixar)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Última versão (APK)
          body: APK mais recente do app Diagnóstico de Rede. Baixe o app-release.apk abaixo.
          files: build/app/outputs/flutter-apk/app-release.apk
